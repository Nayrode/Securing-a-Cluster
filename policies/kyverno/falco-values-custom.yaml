customRules:
  custom-threats.yaml: |-
    - rule: Shell Spawned in Application Container
      desc: Detect shell execution inside an application container
      condition: >
        spawned_process and container and
        proc.name in (sh, bash, dash, ash, zsh) and
        not k8s.ns.name in (kube-system, falco, kyverno, calico-system)
      output: >
        Shell spawned in application container
        (user=%user.name proc=%proc.name parent=%proc.pname cmdline=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name image=%container.image.repository)
      priority: WARNING
      tags: [shell, container, runtime]

    - rule: Service Account Token Read in Application Container
      desc: Detect service account token reads in application containers
      condition: >
        open_read and container and
        fd.name=/var/run/secrets/kubernetes.io/serviceaccount/token and
        not k8s.ns.name in (kube-system, falco, kyverno, calico-system) and
        not container.name in (calico-node, calico-kube-controllers, kube-proxy)
      output: >
        ServiceAccount token read in application container
        (user=%user.name proc=%proc.name cmdline=%proc.cmdline file=%fd.name
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name image=%container.image.repository)
      priority: CRITICAL
      tags: [credential, kubernetes, token, lateral-movement]

    - rule: Contact K8s API From Application Container
      desc: Detect application containers contacting the Kubernetes API
      condition: >
        evt.type=connect and container and
        fd.name contains ":443" and
        not k8s.ns.name in (kube-system, falco, kyverno, calico-system) and
        not container.name in (kube-apiserver, kube-controller-manager, kube-scheduler, etcd, calico-node, kube-proxy)
      output: >
        Application container contacting Kubernetes API
        (user=%user.name connection=%fd.name proc=%proc.name cmdline=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name image=%container.image.repository)
      priority: WARNING
      tags: [kubernetes, network, lateral-movement]

    - rule: Sensitive Host File Read in Application Container
      desc: Detect reads of sensitive host-like files in application containers
      condition: >
        open_read and container and
        fd.name in (/etc/shadow, /etc/passwd, /root/.ssh/authorized_keys) and
        not k8s.ns.name in (kube-system, falco, kyverno, calico-system)
      output: >
        Sensitive file read in application container
        (user=%user.name file=%fd.name proc=%proc.name cmdline=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: CRITICAL
      tags: [credential, filesystem, container]
