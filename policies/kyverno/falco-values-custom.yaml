customRules:
  custom-threats.yaml: |-
    - rule: Shell Spawned in Container
      desc: Detect shell execution inside a container
      condition: >
        spawned_process and container and proc.name in (sh, bash, dash, ash, zsh)
      output: >
        Shell spawned in container
        (user=%user.name proc=%proc.name parent=%proc.pname cmdline=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name image=%container.image.repository)
      priority: WARNING
      tags: [shell, container, runtime]

    - rule: Potential Fork Bomb Command
      desc: Detect common fork bomb command patterns
      condition: >
        spawned_process and container and
        (proc.cmdline contains ":(){ :|:& };:" or
         proc.cmdline contains ":() { :|:& };:" or
         proc.cmdline contains "while true")
      output: >
        Potential fork bomb command detected
        (user=%user.name proc=%proc.name cmdline=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name image=%container.image.repository)
      priority: CRITICAL
      tags: [forkbomb, dos, process]

    - rule: Sensitive File Read in Container
      desc: Detect reads of sensitive files in containers
      condition: >
        open_read and container and
        fd.name in (/etc/shadow, /etc/passwd, /root/.ssh/authorized_keys, /var/run/secrets/kubernetes.io/serviceaccount/token)
      output: >
        Sensitive file read in container
        (user=%user.name file=%fd.name proc=%proc.name cmdline=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: CRITICAL
      tags: [credential, filesystem, container]

    - rule: Contact K8s API From Container
      desc: Detect containers contacting the Kubernetes API server
      condition: >
        evt.type=connect and evt.dir=< and container and fd.typechar=4 and
        k8s.ns.name != falco
      output: >
        Container contacting Kubernetes API
        (user=%user.name connection=%fd.name proc=%proc.name cmdline=%proc.cmdline
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: WARNING
      tags: [kubernetes, network, lateral-movement]
